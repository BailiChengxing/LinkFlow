<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 背景渐变色 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2575FC" />
      <stop offset="100%" stop-color="#6A11CB" />
    </linearGradient>
    <!-- 链接亮色渐变 -->
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 圆角背景圆环 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- 链接图标链环（象征链接清洗与提取） -->
  <g transform="translate(24, 24) scale(0.625)" fill="none" stroke="url(#linkGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左半环 -->
    <path d="M 52,76 L 40,76 A 24,24 0 0,1 40,28 L 52,28" />
    <!-- 右半环 -->
    <path d="M 76,28 L 88,28 A 24,24 0 0,1 88,76 L 76,76" />
    <!-- 中间连接线 -->
    <line x1="44" y1="52" x2="84" y2="52" />
  </g>

  <!-- 右下角闪光星芒（象征“清洗/闪亮”） -->
  <path d="M 96 70 L 98.5 81.5 L 110 84 L 98.5 86.5 L 96 98 L 93.5 86.5 L 82 84 L 93.5 81.5 Z" fill="#FFD700" filter="url(#shadow)" />
</svg>
