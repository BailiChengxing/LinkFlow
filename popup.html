<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="popup.title">清链助手</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 350px;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #202124;
      overflow-x: hidden;
    }

    .app-card {
      padding: 14px;
      width: 100%;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #1a73e8;
    }

    .settings-btn {
      flex-shrink: 0;
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 5px 8px;
      background: #ffffff;
      color: #5f6368;
      font-size: 11px;
      cursor: pointer;
    }

    .settings-btn:hover {
      color: #1a73e8;
      border-color: #a8c7fa;
      background: #f8faff;
    }

    .title-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .input-group {
      position: relative;
      margin-bottom: 10px;
      width: 100%;
    }

    textarea {
      width: 100%;
      height: 90px;
      padding: 8px 8px 36px 8px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
      resize: none;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: #f8f9fa;
      display: block;
    }

    textarea:focus {
      border-color: #1a73e8;
      background-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.15);
    }

    .paste-btn {
      position: absolute;
      right: 6px;
      bottom: 6px;
      background-color: #e8f0fe;
      color: #1a73e8;
      border: 1px solid #d2e3fc;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s, color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      line-height: 1;
    }

    .paste-btn:hover {
      background-color: #1a73e8;
      color: #ffffff;
    }

    .action-btn {
      width: 100%;
      height: 36px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:hover {
      background-color: #1557b0;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .result-section {
      margin-top: 12px;
    }

    .result-title {
      font-size: 12px;
      color: #5f6368;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
    }

    .status {
      font-size: 11px;
      font-weight: 500;
      color: #1e8e3e;
      display: none;
    }

    .links-container {
      max-height: 190px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }

    .links-container::-webkit-scrollbar {
      width: 5px;
    }
    .links-container::-webkit-scrollbar-thumb {
      background: #dadce0;
      border-radius: 4px;
    }

    .link-card {
      padding: 8px 10px;
      background: #f8f9fa;
      border: 1px solid #e8eaed;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .link-text {
      word-break: break-all;
      font-size: 11px;
      color: #1a73e8;
      font-family: ui-monospace, SFMono-Regular, SF Pro Text, Consolas, monospace;
      text-decoration: none;
      line-height: 1.3;
    }

    .link-text:hover {
      text-decoration: underline;
    }

    .link-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .icon-btn {
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      color: #3c4043;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      line-height: 1;
    }

    .icon-btn:hover {
      background: #e8f0fe;
      color: #1a73e8;
      border-color: #d2e3fc;
    }

    .empty-box {
      padding: 8px 10px;
      background: #fce8e6;
      border: 1px solid #fad2cf;
      border-radius: 6px;
      color: #d93025;
      font-size: 12px;
    }

    @media (pointer: coarse) {
        html, body {
          width: 100vw;
        }
        .icon-btn {
          padding: 6px 12px;
          font-size: 12px;
        }
      }

      html[data-theme="dark"] body {
        background-color: #17191f;
        color: #e8eaed;
      }

      html[data-theme="dark"] .settings-btn,
      html[data-theme="dark"] .icon-btn {
        border-color: #454b57;
        background: #252932;
        color: #d7dbe3;
      }

      html[data-theme="dark"] .settings-btn:hover,
      html[data-theme="dark"] .icon-btn:hover {
        border-color: #526b91;
        background: #2d3746;
        color: #a9c7ff;
      }

      html[data-theme="dark"] textarea {
        border-color: #454b57;
        background-color: #22252d;
        color: #e8eaed;
      }

      html[data-theme="dark"] textarea:focus {
        background-color: #1b1e25;
      }

      html[data-theme="dark"] .result-title {
        color: #b6bbc6;
      }

      html[data-theme="dark"] .links-container::-webkit-scrollbar-thumb {
        background: #505662;
      }

      html[data-theme="dark"] .link-card {
        border-color: #343944;
        background: #22252d;
      }

      html[data-theme="dark"] .link-text {
        color: #8ab4f8;
      }

      html[data-theme="dark"] .empty-box {
        border-color: #68413f;
        background: #302322;
        color: #ffaaa4;
      }

      html[data-theme="dark"] #linksContainer > div[style] {
        color: #aeb4c0 !important;
      }
  </style>
</head>
<body>
  <div class="app-card">
    <div class="top-bar">
      <h3>
        <svg class="title-icon" viewBox="0 0 128 128">
          <defs>
            <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2575FC" />
              <stop offset="100%" stop-color="#6A11CB" />
            </linearGradient>
            <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF" />
              <stop offset="100%" stop-color="#E0E7FF" />
            </linearGradient>
          </defs>
          <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" />
          <g transform="translate(24, 24) scale(0.625)" fill="none" stroke="url(#linkGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 52,76 L 40,76 A 24,24 0 0,1 40,28 L 52,28" />
            <path d="M 76,28 L 88,28 A 24,24 0 0,1 88,76 L 76,76" />
            <line x1="44" y1="52" x2="84" y2="52" />
          </g>
          <path d="M 96 70 L 98.5 81.5 L 110 84 L 98.5 86.5 L 96 98 L 93.5 86.5 L 82 84 L 93.5 81.5 Z" fill="#FFD700" />
        </svg>
        <span data-i18n="popup.title">清链助手</span>
      </h3>
      <button id="settingsBtn" class="settings-btn" type="button" data-i18n-title="popup.settingsBtnTitle" data-i18n="popup.settingsBtn">⚙ 设置</button>
    </div>

    <div class="input-group">
      <textarea id="rawInput" data-i18n-placeholder="popup.textareaPlaceholder" placeholder="在此粘贴包含多个链接的文本..."></textarea>
      <button id="pasteBtn" class="paste-btn" type="button" data-i18n-title="popup.pasteBtnTitle" data-i18n="popup.pasteBtn">📋 读取剪贴板</button>
    </div>

    <button id="extractBtn" class="action-btn" data-i18n="popup.extractBtn">提取全部链接</button>

    <div class="result-section">
      <div class="result-title">
        <span id="resultCount" data-i18n="popup.resultPrefix">提取结果：</span>
        <span id="status" class="status"></span>
      </div>
      <div id="linksContainer" class="links-container">
        <div style="font-size: 12px; color: #70757a;" data-i18n="popup.emptyWaiting">等待提取...</div>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
