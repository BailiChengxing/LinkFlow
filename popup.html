<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      width: 320px;
      margin: 0;
      padding: 0;
      background-color: #ffffff !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #202124;
    }

    .app-card {
      padding: 16px;
      box-sizing: border-box;
    }

    h3 {
      margin: 0 0 12px 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 标题旁的 SVG 图标样式 */
    .title-icon {
      width: 20px;
      height: 20px;
      vertical-align: middle;
    }

    .input-group {
      position: relative;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px 10px 34px 10px;
      box-sizing: border-box;
      border: 1px solid #dadce0;
      border-radius: 10px;
      font-size: 12px;
      resize: none;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: #f8f9fa;
    }

    textarea:focus {
      border-color: #1a73e8;
      background-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.15);
    }

    .paste-btn {
      position: absolute;
      right: 8px;
      bottom: 10px;
      background-color: #e8f0fe;
      color: #1a73e8;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .paste-btn:hover {
      background-color: #d2e3fc;
    }

    .action-btn {
      width: 100%;
      padding: 10px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s, transform 0.1s;
    }

    .action-btn:hover {
      background-color: #1557b0;
    }

    .action-btn:active {
      transform: scale(0.99);
    }

    .result-section {
      margin-top: 14px;
    }

    .result-title {
      font-size: 11px;
      color: #5f6368;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status {
      font-size: 11px;
      font-weight: 500;
      display: none;
    }

    .links-container {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .link-card {
      padding: 8px 10px;
      background: #f8f9fa;
      border: 1px solid #e8eaed;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .link-text {
      word-break: break-all;
      font-size: 12px;
      color: #1a73e8;
      font-family: monospace;
      text-decoration: none;
      cursor: pointer;
    }

    .link-text:hover {
      text-decoration: underline;
    }

    .link-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .icon-btn {
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      color: #3c4043;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: #e8f0fe;
      color: #1a73e8;
      border-color: #d2e3fc;
    }

    .empty-box {
      padding: 10px;
      background: #fce8e6;
      border: 1px solid #fad2cf;
      border-radius: 8px;
      color: #d93025;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="app-card">
    <h3>
      <svg class="title-icon" viewBox="0 0 128 128">
        <defs>
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2575FC" />
            <stop offset="100%" stop-color="#6A11CB" />
          </linearGradient>
          <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#E0E7FF" />
          </linearGradient>
        </defs>
        <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" />
        <g transform="translate(24, 24) scale(0.625)" fill="none" stroke="url(#linkGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 52,76 L 40,76 A 24,24 0 0,1 40,28 L 52,28" />
          <path d="M 76,28 L 88,28 A 24,24 0 0,1 88,76 L 76,76" />
          <line x1="44" y1="52" x2="84" y2="52" />
        </g>
        <path d="M 96 70 L 98.5 81.5 L 110 84 L 98.5 86.5 L 96 98 L 93.5 86.5 L 82 84 L 93.5 81.5 Z" fill="#FFD700" />
      </svg>
      批量链接提取
    </h3>

    <div class="input-group">
      <textarea id="rawInput" placeholder="在此粘贴包含多个链接的混乱文本..."></textarea>
      <button id="pasteBtn" class="paste-btn" title="读取剪切板">📋 读取剪切板</button>
    </div>

    <button id="extractBtn" class="action-btn">提取全部链接</button>

    <div class="result-section">
      <div class="result-title">
        <span id="resultCount">提取结果：</span>
        <span id="status" class="status"></span>
      </div>
      <div id="linksContainer" class="links-container">
        <div style="font-size: 12px; color: #70757a;">等待提取...</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
